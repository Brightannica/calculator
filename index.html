<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Brotato</title>
	<style type='text/css'>

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222223;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			height: 42px;
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
		}
	</style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>

</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		// Fix for iOS Safari WebGL context issue: getContextAttributes() can return null
		// Patch getContext on the canvas to ensure any created context has a safe getContextAttributes
		function patchCanvasContext(canvas) {
			const originalGetContext = canvas.getContext.bind(canvas);
			canvas.getContext = function(contextType, attributes) {
				console.log('[WebGL Fix] getContext called:', contextType, attributes);
				const context = originalGetContext(contextType, attributes);
				console.log('[WebGL Fix] getContext returned:', context ? 'context created' : 'null');
				if (context && (contextType === 'webgl' || contextType === 'webgl2' || contextType === 'experimental-webgl')) {
					// Log initial context attributes
					try {
						const initialAttrs = context.getContextAttributes();
						console.log('[WebGL Fix] Initial context attributes:', initialAttrs);
					} catch (e) {
						console.warn('[WebGL Fix] Error getting initial attributes:', e);
					}

					// Patch getContextAttributes to never return null
					if (!context._patchedGetContextAttributes) {
						const originalGetContextAttributes = context.getContextAttributes.bind(context);
						context.getContextAttributes = function() {
							const attrs = originalGetContextAttributes();
							console.log('[WebGL Fix] getContextAttributes called, returned:', attrs);
							if (attrs === null) {
								console.warn('[WebGL Fix] getContextAttributes returned null! Returning safe defaults.');
								return {
									alpha: true,
									antialias: true,
									depth: true,
									stencil: false,
									premultipliedAlpha: true,
									preserveDrawingBuffer: false,
								};
							}
							return attrs;
						};
						context._patchedGetContextAttributes = true;
						console.log('[WebGL Fix] Patched getContextAttributes for context');
					}

					// Log WebGL version info
					try {
						const version = context.getParameter(context.VERSION);
						const shadingLanguageVersion = context.getParameter(context.SHADING_LANGUAGE_VERSION);
						const vendor = context.getParameter(context.VENDOR);
						const renderer = context.getParameter(context.RENDERER);
						console.log('[WebGL Fix] Context info:', { version, shadingLanguageVersion, vendor, renderer });
					} catch (e) {
						console.warn('[WebGL Fix] Could not get context parameters:', e);
					}

					// Patch shader creation methods for debugging
					patchShaderMethods(context);
				}
				return context;
			};
		}

		// Patch WebGL shader methods to debug shader creation issues
		function patchShaderMethods(gl) {
			// Patch createShader
			const originalCreateShader = gl.createShader.bind(gl);
			gl.createShader = function(type) {
				const shader = originalCreateShader(type);
				console.log('[WebGL Fix] createShader:', type === gl.VERTEX_SHADER ? 'VERTEX' : type === gl.FRAGMENT_SHADER ? 'FRAGMENT' : type, '->', shader);
				if (!shader) {
					console.error('[WebGL Fix] createShader returned null! Error:', gl.getError());
				}
				return shader;
			};

			// Patch shaderSource
			const originalShaderSource = gl.shaderSource.bind(gl);
			gl.shaderSource = function(shader, source) {
				console.log('[WebGL Fix] shaderSource called, shader:', shader, 'source length:', source ? source.length : 0);
				if (!shader || !(shader instanceof WebGLShader)) {
					console.error('[WebGL Fix] INVALID SHADER passed to shaderSource:', shader);
					console.trace('[WebGL Fix] shaderSource call stack:');
				}
				return originalShaderSource(shader, source);
			};

			// Patch compileShader
			const originalCompileShader = gl.compileShader.bind(gl);
			gl.compileShader = function(shader) {
				console.log('[WebGL Fix] compileShader called, shader:', shader);
				originalCompileShader(shader);
				const compiled = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
				if (!compiled) {
					const infoLog = gl.getShaderInfoLog(shader);
					console.error('[WebGL Fix] Shader compilation failed:', infoLog);
				} else {
					console.log('[WebGL Fix] Shader compiled successfully');
				}
			};

			// Patch createProgram
			const originalCreateProgram = gl.createProgram.bind(gl);
			gl.createProgram = function() {
				const program = originalCreateProgram();
				console.log('[WebGL Fix] createProgram ->', program);
				return program;
			};

			// Patch linkProgram
			const originalLinkProgram = gl.linkProgram.bind(gl);
			gl.linkProgram = function(program) {
				console.log('[WebGL Fix] linkProgram called, program:', program);
				originalLinkProgram(program);
				const linked = gl.getProgramParameter(program, gl.LINK_STATUS);
				if (!linked) {
					const infoLog = gl.getProgramInfoLog(program);
					console.error('[WebGL Fix] Program linking failed:', infoLog);
				} else {
					console.log('[WebGL Fix] Program linked successfully');
				}
			};

			// Patch getError to log errors
			const originalGetError = gl.getError.bind(gl);
			gl.getError = function() {
				const error = originalGetError();
				if (error !== gl.NO_ERROR) {
					const errorNames = {
						0x0500: 'INVALID_ENUM',
						0x0501: 'INVALID_VALUE',
						0x0502: 'INVALID_OPERATION',
						0x0503: 'STACK_OVERFLOW',
						0x0504: 'STACK_UNDERFLOW',
						0x0505: 'OUT_OF_MEMORY',
						0x0506: 'INVALID_FRAMEBUFFER_OPERATION',
						0x0507: 'CONTEXT_LOST_WEBGL'
					};
					console.error('[WebGL Fix] GL Error:', errorNames[error] || error);
					console.trace('[WebGL Fix] GL Error stack:');
				}
				return error;
			};
		}

		// Handle WebGL context loss on iOS Safari
		function setupContextLossHandling(canvas) {
			canvas.addEventListener('webglcontextlost', function(event) {
				event.preventDefault();
				console.error('[WebGL Fix] CONTEXT LOST!', new Error().stack);
			}, false);

			canvas.addEventListener('webglcontextrestored', function(event) {
				console.log('[WebGL Fix] CONTEXT RESTORED');
				// Try to log new context info
				setTimeout(() => {
					try {
						const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
						if (gl) {
							const attrs = gl.getContextAttributes();
							console.log('[WebGL Fix] Restored context attributes:', attrs);
						}
					} catch (e) {
						console.warn('[WebGL Fix] Error checking restored context:', e);
					}
				}, 0);
			}, false);
		}

		// Global error handler for uncaught errors
		window.addEventListener('error', function(event) {
			console.error('[WebGL Fix] Uncaught error:', event.error || event.message);
			if (event.error && event.error.stack) {
				console.error('[WebGL Fix] Stack:', event.error.stack);
			}
		});

		window.addEventListener('unhandledrejection', function(event) {
			console.error('[WebGL Fix] Unhandled rejection:', event.reason);
			if (event.reason && event.reason.stack) {
				console.error('[WebGL Fix] Stack:', event.reason.stack);
			}
		});

		// Patch Engine.isWebGLAvailable to use patched context check
		const originalIsWebGLAvailable = Engine.isWebGLAvailable;
		Engine.isWebGLAvailable = function(majorVersion) {
			console.log('[WebGL Fix] Engine.isWebGLAvailable called with:', majorVersion);
			const result = originalIsWebGLAvailable.call(this, majorVersion);
			console.log('[WebGL Fix] Engine.isWebGLAvailable returned:', result);
			return result;
		};

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":51086080,"index.wasm":19721321},"focusCanvas":true,"gdnativeLibs":[]};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				const canvas = document.getElementById('canvas');
				console.log('[WebGL Fix] Canvas found:', canvas);
				console.log('[WebGL Fix] Canvas size:', canvas.width, 'x', canvas.height);
				console.log('[WebGL Fix] Canvas client size:', canvas.clientWidth, 'x', canvas.clientHeight);

				// Patch canvas getContext to auto-patch any WebGL context created on it
				patchCanvasContext(canvas);
				setupContextLossHandling(canvas);
				setStatusMode('indeterminate');

				console.log('[WebGL Fix] Calling engine.startGame...');
				engine.startGame({
					'canvas': canvas,
					'onProgress': function (current, total) {
						console.log('[WebGL Fix] Progress:', current, '/', total);
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							if (current === total) {
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					console.log('[WebGL Fix] Engine started successfully!');
					setStatusMode('hidden');
					initializing = false;
				}, function(err) {
					console.error('[WebGL Fix] Engine startGame failed:', err);
					if (err && err.stack) console.error('[WebGL Fix] Stack:', err.stack);
					displayFailureNotice(err);
				});
			}
		})();
	//]]></script>
</body>
</html>
