<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Brotato</title>
	<style type='text/css'>

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222223;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			height: 42px;
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
		}

		/* Debug log panel - ALWAYS VISIBLE at bottom */
		#debug-log-panel {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			height: 160px;
			max-height: 40vh;
			background: rgba(0, 0, 0, 0.98);
			color: #0f0;
			font-family: monospace;
			font-size: 9px;
			line-height: 1.2;
			overflow-y: auto;
			z-index: 999999;
			border-top: 2px solid #0f0;
			padding: 6px;
			text-align: left;
			white-space: pre-wrap;
			word-break: break-all;
			box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
		}
		#debug-log-panel .log-entry {
			margin: 0;
			padding: 1px 3px;
			border-radius: 1px;
		}
		#debug-log-panel .log-error { color: #f66; background: rgba(255,0,0,0.1); }
		#debug-log-panel .log-warn { color: #ff6; background: rgba(255,255,0,0.1); }
		#debug-log-panel .log-error, #debug-log-panel .log-warn { font-weight: bold; }
		#debug-log-panel .timestamp { color: #666; margin-right: 4px; font-size: 8px; }
		#debug-log-panel .log-label { font-weight: bold; margin-right: 3px; }
		#debug-controls {
			position: fixed;
			top: 8px;
			right: 8px;
			z-index: 999999;
			display: flex;
			gap: 6px;
		}
		#debug-controls button {
			background: #000;
			color: #0f0;
			border: 1px solid #0f0;
			padding: 6px 10px;
			border-radius: 4px;
			font-size: 11px;
			font-weight: bold;
			cursor: pointer;
			font-family: monospace;
			box-shadow: 0 1px 4px rgba(0,0,0,0.5);
		}
		#debug-controls button:active { background: #0f0; color: #000; }
	</style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>

</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>

	<!-- Debug controls at top-right -->
	<div id="debug-controls">
		<button id="debug-toggle" onclick="toggleDebugLog()">HIDE</button>
		<button id="debug-copy" onclick="copyDebugLogs()">COPY</button>
	</div>

	<!-- Debug log panel - always visible at bottom -->
	<div id="debug-log-panel" class="visible"></div>

	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		// Optimized debug log capture - throttled rendering to prevent freezing
		(function() {
			const logPanel = document.getElementById('debug-log-panel');
			const toggleBtn = document.getElementById('debug-toggle');
			const logs = [];
			let visible = true;
			let renderScheduled = false;

			function addLog(level, args) {
				const time = new Date().toLocaleTimeString();
				const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
				logs.push({ time, level, msg });
				if (logs.length > 100) logs.shift(); // Reduced from 500
				if (!renderScheduled) {
					renderScheduled = true;
					requestAnimationFrame(renderLogs);
				}
			}

			function renderLogs() {
				renderScheduled = false;
				if (!logPanel) return;
				logPanel.innerHTML = logs.map(l => 
					`<div class="log-entry log-${l.level}">`
					+ `<span class="timestamp">${l.time}</span>`
					+ `<span class="log-label">[${l.level.toUpperCase()}]</span>`
					+ `<span>${l.msg}</span></div>`
				).join('');
				if (visible) logPanel.scrollTop = logPanel.scrollHeight;
			}

			window.toggleDebugLog = function() {
				visible = !visible;
				logPanel.classList.toggle('visible', visible);
				toggleBtn.textContent = visible ? 'HIDE' : 'SHOW';
			};

			window.copyDebugLogs = function() {
				const text = logs.map(l => `${l.time} [${l.level.toUpperCase()}] ${l.msg}`).join('\n');
				navigator.clipboard.writeText(text).then(() => {
					const orig = toggleBtn.textContent;
					toggleBtn.textContent = 'COPIED!';
					setTimeout(() => { toggleBtn.textContent = orig; }, 1500);
				}).catch(() => {
					// Fallback
					const ta = document.createElement('textarea');
					ta.value = text;
					document.body.appendChild(ta);
					ta.select();
					document.execCommand('copy');
					document.body.removeChild(ta);
				});
			};

			// Capture console methods - only log important stuff to panel
			['warn', 'error'].forEach(level => {
				const orig = console[level];
				console[level] = function(...args) {
					addLog(level, args);
					orig.apply(console, args);
				};
			});
			// log/info only go to console, not panel (too verbose during loading)
			['log', 'info'].forEach(level => {
				const orig = console[level];
				console[level] = function(...args) {
					orig.apply(console, args);
				};
			});

			// Capture unhandled errors
			window.addEventListener('error', e => {
				addLog('error', ['Uncaught:', e.message, e.stack]);
			});
			window.addEventListener('unhandledrejection', e => {
				addLog('error', ['Unhandled rejection:', e.reason]);
			});

			// Initial log
			addLog('warn', ['Debug panel ready - tap HIDE to toggle, COPY to copy logs']);
		})();

		// Fix for iOS Safari WebGL context issue: getContextAttributes() can return null
		// Patch ONLY the game canvas getContext to ensure its contexts have safe getContextAttributes
		function patchCanvasGetContext(canvas) {
			const originalGetContext = canvas.getContext.bind(canvas);
			canvas.getContext = function(contextType, attributes) {
				const context = originalGetContext(contextType, attributes);
				if (context && (contextType === 'webgl' || contextType === 'webgl2' || contextType === 'experimental-webgl')) {
					patchWebGLContext(context);
					patchShaderMethods(context);
				}
				return context;
			};
		}

		// Patch a WebGL context to have safe getContextAttributes
		function patchWebGLContext(gl) {
			if (gl._patchedGetContextAttributes) return;
			const originalGetContextAttributes = gl.getContextAttributes.bind(gl);
			gl.getContextAttributes = function() {
				const attrs = originalGetContextAttributes();
				if (attrs === null) {
					return {
						alpha: true,
						antialias: true,
						depth: true,
						stencil: false,
						premultipliedAlpha: true,
						preserveDrawingBuffer: false,
					};
				}
				return attrs;
			};
			gl._patchedGetContextAttributes = true;
		}

		// Handle WebGL context loss on iOS Safari
		function setupContextLossHandling(canvas) {
			canvas.addEventListener('webglcontextlost', function(event) {
				event.preventDefault(); // Allow context restoration
			}, false);

			canvas.addEventListener('webglcontextrestored', function(event) {
				setTimeout(() => {
					const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
					if (gl) {
						patchWebGLContext(gl);
						patchShaderMethods(gl);
					}
				}, 0);
			}, false);
		}

		// Patch shader methods to validate shader objects and catch errors early
		function patchShaderMethods(gl) {
			if (gl._patchedShaderMethods) return;
			gl._patchedShaderMethods = true;

			const shaderMethods = ['shaderSource', 'compileShader', 'getShaderParameter', 'getShaderInfoLog', 'deleteShader', 'getShaderSource'];
			shaderMethods.forEach(method => {
				if (typeof gl[method] === 'function') {
					const original = gl[method].bind(gl);
					gl[method] = function(shader, ...args) {
						if (gl.isContextLost && gl.isContextLost()) {
							return method === 'getShaderInfoLog' ? '' : undefined;
						}
						if (!shader || !(shader instanceof WebGLShader || (shader && shader.__webglFixDummy))) {
							return method === 'getShaderInfoLog' ? '' : undefined;
						}
						return original(shader, ...args);
					};
				}
			});

			// Create a fully functional dummy shader
			function createDummyShader() {
				const dummy = { __webglFixDummy: true, _type: 'WebGLShader' };
				return new Proxy(dummy, {
					get(target, prop) {
						if (prop in target) return target[prop];
						return function() {};
					},
					set(target, prop, value) { target[prop] = value; return true; }
				});
			}

			// Patch createShader to NEVER return null
			const originalCreateShader = gl.createShader.bind(gl);
			gl.createShader = function(type) {
				const shader = originalCreateShader(type);
				if (!shader) {
					return createDummyShader();
				}
				return shader;
			};

			// Patch program methods too (they can also receive stale objects)
			const programMethods = ['attachShader', 'detachShader', 'linkProgram', 'getProgramParameter', 'getProgramInfoLog', 'deleteProgram', 'useProgram', 'validateProgram', 'getAttribLocation', 'getUniformLocation', 'getActiveAttrib', 'getActiveUniform', 'bindAttribLocation', 'getProgramInfoLog'];
			programMethods.forEach(method => {
				if (typeof gl[method] === 'function') {
					const original = gl[method].bind(gl);
					gl[method] = function(program, ...args) {
						if (gl.isContextLost && gl.isContextLost()) {
							return;
						}
						if (program === null || program === undefined) {
							return;
						}
						if (!(program instanceof WebGLProgram || (program && program.__webglFixDummy))) {
							return;
						}
						try {
							return original(program, ...args);
						} catch (e) {
							if (e.message && (e.message.includes('WebGLProgram') || e.message.includes('program.name'))) {
								return;
							}
							throw e;
						}
					};
				}
			});

			// Create a fully functional dummy program that accepts any property/method
			function createDummyProgram() {
				const dummy = { __webglFixDummy: true, _type: 'WebGLProgram' };
				return new Proxy(dummy, {
					get(target, prop) {
						if (prop in target) return target[prop];
						return function() {};
					},
					set(target, prop, value) { target[prop] = value; return true; }
				});
			}

			// Patch createProgram to NEVER return null - return a functional dummy if context lost
			const originalCreateProgram = gl.createProgram.bind(gl);
			gl.createProgram = function() {
				const program = originalCreateProgram();
				if (!program) {
					return createDummyProgram();
				}
				return program;
			};
		}

		// Global error handlers
		window.addEventListener('error', function(event) {
			console.error(event.error || event.message);
		});
		window.addEventListener('unhandledrejection', function(event) {
			console.error(event.reason);
		});

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":51086080,"index.wasm":19721321},"focusCanvas":true,"gdnativeLibs":[]};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				const canvas = document.getElementById('canvas');
				// Ensure canvas has valid dimensions
				if (canvas.width === 0) canvas.width = canvas.clientWidth || window.innerWidth || 320;
				if (canvas.height === 0) canvas.height = canvas.clientHeight || window.innerHeight || 240;

				// Patch ONLY this canvas's getContext - don't patch globally
				patchCanvasGetContext(canvas);
				setupContextLossHandling(canvas);
				setStatusMode('indeterminate');

				engine.startGame({
					'canvas': canvas,
					'onProgress': function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							if (current === total) {
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, function(err) {
					console.error('Engine startGame failed:', err);
					if (err && err.stack) console.error('Stack:', err.stack);
					displayFailureNotice(err);
				});
			}
		})();
	//]]></script>
</body>
</html>
